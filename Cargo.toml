[package]
name = "copilot-api"
version = "1.12.5"
edition = "2021"
description = "OpenAI and Anthropic-compatible gateway for GitHub Copilot or Codex or third-party providers (Rust port)."
license = "MIT"
repository = "https://github.com/Arthur742Ramos/copilot-api-rust"
homepage = "https://github.com/Arthur742Ramos/copilot-api-rust"
readme = "README.md"
keywords = ["github-copilot", "openai", "anthropic", "gateway", "proxy"]
categories = ["command-line-utilities", "web-programming"]
rust-version = "1.82"
default-run = "copilot-api"

[[bin]]
name = "copilot-api"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "catch-panic", "limit"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
dirs = "5"
regex = "1"
once_cell = "1"
url = "2"
mac_address = "1"
arboard = "3"
tiktoken-rs = "0.6"
chrono = "0.4"
ruzstd = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
indexmap = { version = "2", features = ["serde"] }
# Used by the pooled websocket responses transport (later in this stacked
# series); declared here so the dependency set is stable across the stack.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[profile.release]
opt-level = 3
lto = "thin"
