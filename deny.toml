# cargo-deny configuration.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Use the default advisory database. Vulnerabilities should fail the check;
# unmaintained / yanked crates are downgraded to warnings so the existing tree
# stays green.
version = 2
ignore = []
unmaintained = "workspace"
yanked = "warn"

[licenses]
version = 2
# Permissive licenses present across the dependency tree.
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    # tiktoken-rs bundles BPE token-merge data under the Community Data License.
    "CDLA-Permissive-2.0",
]
# Allow crates with no license metadata to be flagged rather than hard-fail.
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate are common in a large tree; warn only.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
