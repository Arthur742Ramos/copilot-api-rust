name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: copilot-api
            asset: copilot-api-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: copilot-api
            asset: copilot-api-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: copilot-api.exe
            asset: copilot-api-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin copilot-api

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true

  docker:
    name: build / push docker image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-crate:
    name: publish to crates.io
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-publish-
            ${{ runner.os }}-cargo-

      - name: Verify tag matches Cargo.toml version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Strip the leading "v" from the tag (e.g. v1.12.5 -> 1.12.5).
          tag_version="${GITHUB_REF_NAME#v}"
          # Read the [package] version robustly via cargo metadata (never a dependency version).
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "copilot-api") | .version')"
          echo "Tag version:        ${tag_version}"
          echo "Cargo.toml version: ${crate_version}"
          if [ -z "${crate_version}" ]; then
            echo "::error::Could not determine crate version from Cargo.toml" >&2
            exit 1
          fi
          if [ "${tag_version}" != "${crate_version}" ]; then
            echo "::error::Git tag 'v${tag_version}' does not match Cargo.toml version '${crate_version}'. Refusing to publish." >&2
            exit 1
          fi
          echo "version=${crate_version}" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # crates.io REQUIRES a non-empty User-Agent or it returns 403 (data-access-policy).
          ua="copilot-api-release-ci (https://github.com/${GITHUB_REPOSITORY})"
          # Retry transient failures (curl errors, 5xx, 403) before giving up, so an
          # otherwise-valid re-run is not hard-failed by a momentary blip.
          http_code="000"
          for attempt in 1 2 3; do
            http_code="$(curl -sS -o response.json -w '%{http_code}' \
              -H "User-Agent: ${ua}" \
              "https://crates.io/api/v1/crates/copilot-api")" || http_code="000"
            case "${http_code}" in
              200|404) break ;;
              *)
                echo "Attempt ${attempt}: got HTTP ${http_code} from crates.io; retrying..." >&2
                sleep 5
                ;;
            esac
          done
          case "${http_code}" in
            404)
              # Crate has never been published; this is the first release.
              echo "Crate 'copilot-api' not found on crates.io; will publish version ${VERSION}."
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              if jq -e --arg v "${VERSION}" '.versions[]? | select(.num == $v)' response.json >/dev/null; then
                echo "Version ${VERSION} is already on crates.io; skipping publish (idempotent re-run)."
                echo "published=true" >> "$GITHUB_OUTPUT"
              else
                echo "Version ${VERSION} not yet on crates.io; will publish."
                echo "published=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              # Could not get an authoritative answer. Do not hard-fail: fall through to
              # publish, where cargo's own already-exists rejection is absorbed as success.
              echo "::warning::Could not confirm published state (last HTTP ${http_code}); will attempt publish and rely on the already-exists guard."
              cat response.json >&2 || true
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          if cargo publish --locked 2> >(tee publish.err >&2); then
            echo "Published successfully."
            exit 0
          fi
          # Absorb the race / eventual-consistency case where the version is already on
          # crates.io, so an idempotent re-run never fails.
          if grep -qiE 'already (exists|uploaded)|crate version .* is already' publish.err; then
            echo "::warning::Version already on crates.io; treating as an idempotent success."
            exit 0
          fi
          echo "::error::cargo publish failed for a reason other than already-published." >&2
          exit 1
