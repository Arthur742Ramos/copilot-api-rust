# One-service compose for copilot-api.
#
# First-time login (device-code flow, interactive) — run once; the token is
# saved to the named volume and reused on every subsequent `up`:
#
#   docker compose run --rm copilot-api auth
#
# Then start the server:
#
#   docker compose up
#
# Alternatively, skip the interactive step by exporting a pre-generated token on
# the host before `up` — see the COPILOT_API_GITHUB_TOKEN note below.
services:
  copilot-api:
    build: .
    image: copilot-api
    ports:
      - "4141:4141"
    volumes:
      - copilot-api-data:/data
    # The image already sets COPILOT_API_HOST=0.0.0.0 so the published port
    # works. COPILOT_API_GITHUB_TOKEN is passed through from the host using the
    # list form (no `=value`): when the host variable is unset it is left
    # UNDEFINED in the container rather than set to an empty string. An
    # empty-but-present value would be treated as a provided token by clap's env
    # binding and would defeat the interactive auth flow.
    environment:
      - COPILOT_API_GITHUB_TOKEN
    restart: unless-stopped

volumes:
  copilot-api-data:
